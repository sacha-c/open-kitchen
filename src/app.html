<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: paraglide.lang should be a valid value -->
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="%sveltekit.assets%/favicon.svg">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute(
              "data-theme",
              theme === "dark" ? "culinary-dark" : "culinary",
            );
          }
        } catch {
          // localStorage may be unavailable (private browsing, disabled storage)
        }
      })();
    </script>
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
