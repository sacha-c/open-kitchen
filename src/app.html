<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: paraglide.lang should be a valid value -->
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48">
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
