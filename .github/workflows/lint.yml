on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
          run_install: true
          cache: true
      - name: lint
        run: pnpm lint:ci
