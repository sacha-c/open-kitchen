on:
  - push
  - pull_request

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
          run_install: true
          cache: true
      - name: lint
        run: pnpm lint:ci
      - name: notify vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - open-kitchen: lint'
