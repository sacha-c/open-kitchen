name: Check Migrations

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/server/db/schema.ts'
      - 'drizzle.config.ts'
  pull_request:
    paths:
      - 'src/lib/server/db/schema.ts'
      - 'drizzle.config.ts'

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm and dependencies
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Check for missing migrations
        run: |
          pnpm db:generate
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Missing migrations detected!"
            echo "It looks like your schema.ts changed, but the migration files weren't generated."
            echo "Please run 'pnpm db:generate' locally and commit the resulting files."
            git status
            exit 1
          else
            echo "✅ Migrations are up to date."
          fi
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
